[project]
name = "micro-model-agent"
version = "0.1.0"
description = "Framework for building specialized agents powered by small local models."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "micro-model-agent contributors" },
]
keywords = ["agents", "local-models", "ollama", "mcp"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=1.0.0",
  "ollama>=0.4.0",
  "pydantic>=2.8.0",
  "typer>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/micro-model-agent/micro-model-agent"
Issues = "https://github.com/micro-model-agent/micro-model-agent/issues"

[project.scripts]
micro-agent = "micro_model_agent.interfaces.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.11.0",
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]
training = [
  "accelerate",
  "datasets",
  "peft",
  "torch",
  "transformers",
  "trl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/micro_model_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/micro_model_agent/interfaces/cli/*.py" = ["B008"]
"src/micro_model_agent/interfaces/cli/commands/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["datasets", "peft", "torch", "transformers"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
python_files = ["test_*.py"]
testpaths = ["src"]
filterwarnings = [
    # TestRunTool in command_runner.py looks like a test class to pytest; suppress the warning
    "ignore::pytest.PytestCollectionWarning",
]
